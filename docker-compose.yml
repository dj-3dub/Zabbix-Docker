name: zabbix-monitoring

networks:
  zbx-net:
    driver: bridge

volumes:
  zbx-db-data:
  zbx-server-data:
  zbx-logs:

services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: zbx-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - zbx-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    networks:
      - zbx-net

  server:
    image: zabbix/zabbix-server-pgsql:alpine-7.4.11
    container_name: zbx-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_SERVER_HOST: db
      DB_SERVER_PORT: 5432
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      ZBX_STARTPOLLERS: "8"
      ZBX_CACHESIZE: "128M"
      TZ: ${TZ}
    ports:
      - "${ZBX_PORT}:10051/tcp"
    volumes:
      - zbx-server-data:/var/lib/zabbix
      - zbx-logs:/var/log/zabbix
    ulimits:
      nofile: 65536
    security_opt:
      - no-new-privileges:true
    networks:
      - zbx-net

  web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.4.11
    container_name: zbx-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      server:
        condition: service_started
    environment:
      DB_SERVER_HOST: db
      DB_SERVER_PORT: 5432
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      ZBX_SERVER_HOST: server
      PHP_TZ: ${TZ}
    ports:
      - "${WEB_PORT}:8080"
    security_opt:
      - no-new-privileges:true
    networks:
      - zbx-net

  agent:
    image: zabbix/zabbix-agent2:alpine-7.4.11
    container_name: zbx-agent
    restart: unless-stopped
    environment:
      ZBX_SERVER_HOST: server
      ZBX_HOSTNAME: ${ZBX_AGENT_HOSTNAME}
      TZ: ${TZ}
    security_opt:
      - no-new-privileges:true
    networks:
      - zbx-net
